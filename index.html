<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>台灣行政區房價與租金</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    color: #222;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
}


.container {

    max-width: 1200px;

    margin: auto;

    padding: 30px 20px;
}


h1 {

    margin: 0;

    font-size: 28px;

    font-weight: 700;
}


.subtitle {

    margin-top: 8px;

    margin-bottom: 25px;

    color: #777;

    font-size: 15px;
}


.toolbar {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 18px;
}


select,
input {

    height: 42px;

    border: 1px solid #d7dbe0;

    border-radius: 8px;

    background: white;

    padding: 0 12px;

    font-size: 15px;
}


select {

    min-width: 150px;
}


input {

    width: 260px;
}


.table-container {

    background: white;

    border: 1px solid #e2e5e9;

    border-radius: 12px;

    overflow-x: auto;
}


table {

    width: 100%;

    border-collapse: collapse;

    min-width: 720px;
}


thead {

    background: #fafafa;
}


th,
td {

    padding: 14px 16px;

    border-bottom: 1px solid #eeeeee;
}


th {

    font-weight: 600;

    white-space: nowrap;
}


td {

    white-space: nowrap;
}


td.number,
th.number {

    text-align: right;
}


tbody tr:hover {

    background: #f8fafc;
}


.empty {

    text-align: center;

    color: #888;

    padding: 35px;
}


.footer {

    margin-top: 15px;

    color: #777;

    font-size: 13px;

    line-height: 1.7;
}


.count {

    margin-bottom: 10px;

    color: #666;

    font-size: 14px;
}


@media (max-width: 650px) {

    .container {

        padding: 20px 12px;
    }


    h1 {

        font-size: 23px;
    }


    input {

        width: 100%;
    }


    select {

        width: 100%;
    }

}

</style>

</head>


<body>


<div class="container">


    <h1>
        台灣行政區房價與租金
    </h1>


    <div class="subtitle">

        全台灣本島各縣市、鄉鎮市區房價與租金資料

    </div>


    <div class="toolbar">


        <select id="citySelect">

            <option value="">
                全部縣市
            </option>

        </select>


        <input
            type="text"
            id="searchInput"
            placeholder="搜尋行政區，例如：中壢區"
        >


    </div>


    <div
        class="count"
        id="count"
    ></div>


    <div class="table-container">


        <table>


            <thead>

                <tr>

                    <th>
                        行政區
                    </th>


                    <th class="number">
                        中位數房價
                    </th>


                    <th class="number">
                        平均租金
                    </th>


                    <th class="number">
                        房價/所得
                    </th>

                </tr>

            </thead>


            <tbody id="tableBody">

            </tbody>


        </table>


    </div>


    <div class="footer">

        房價：內政部不動產實價登錄資料。<br>

        租金：內政部不動產租賃資料。<br>

        房價/所得：目前尚未載入所得資料。<br>

        行政區範圍：台灣本島，不包含澎湖、金門、連江。

    </div>


</div>


<!--
========================================================
載入房價資料
========================================================
-->

<script src="housing.js?v=2"></script>


</body>

</html>
