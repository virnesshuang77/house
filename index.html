    // =========================
    // 台東縣

    ["台東縣", "台東市"],
    ["台東縣", "成功鎮"],
    ["台東縣", "關山鎮"],
    ["台東縣", "卑南鄉"],
    ["台東縣", "鹿野鄉"],
    ["台東縣", "池上鄉"],
    ["台東縣", "東河鄉"],
    ["台東縣", "長濱鄉"],

    ["台東縣", "大武鄉"],

/*
========================================================
建立資料
========================================================
*/

const data = districts.map(item => {

    return {

        city: item[0],

        district: item[1],

        medianPrice: null,

        averageRent: null,

        priceIncome: null

    };

});



/*
========================================================
建立縣市選單
========================================================
*/

const citySelect = document.getElementById("citySelect");

const cities = [...new Set(
    data.map(item => item.city)
)];

cities.forEach(city => {

    const option = document.createElement("option");

    option.value = city;

    option.textContent = city;

    citySelect.appendChild(option);

});



/*
========================================================
顯示資料
========================================================
*/

const tableBody = document.getElementById("tableBody");

const count = document.getElementById("count");

const searchInput = document.getElementById("searchInput");


function renderTable() {

    const selectedCity = citySelect.value;

    const keyword =
        searchInput.value.trim().toLowerCase();


    const filtered = data.filter(item => {

        const cityMatch =
            !selectedCity ||
            item.city === selectedCity;


        const keywordMatch =
            !keyword ||
            item.district
                .toLowerCase()
                .includes(keyword);


        return cityMatch && keywordMatch;

    });


    count.textContent =
        `共 ${filtered.length} 個行政區`;


    if (filtered.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="4" class="empty">
                    找不到符合的行政區
                </td>
            </tr>
        `;

        return;

    }


    tableBody.innerHTML = filtered.map(item => {

        const fullName =
            item.city + item.district;


        return `

            <tr>

                <td>
                    ${fullName}
                </td>

                <td class="number">
                    ${
                        item.medianPrice === null
                        ? "—"
                        : item.medianPrice.toLocaleString() + " 元/坪"
                    }
                </td>

                <td class="number">
                    ${
                        item.averageRent === null
                        ? "—"
                        : item.averageRent.toLocaleString() + " 元/月"
                    }
                </td>

                <td class="number">
                    ${
                        item.priceIncome === null
                        ? "—"
                        : item.priceIncome.toFixed(1) + " 倍"
                    }
                </td>

            </tr>

        `;

    }).join("");

}



citySelect.addEventListener(
    "change",
    renderTable
);


searchInput.addEventListener(
    "input",
    renderTable
);


renderTable();

</script>
