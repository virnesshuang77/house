name: Update Taiwan Housing Data

on:
  workflow_dispatch:

  # 每月 2 日台灣時間早上 6:00
  # GitHub Actions 使用 UTC
  schedule:
    - cron: "0 22 1 * *"

permissions:
  contents: write

jobs:
  update-housing:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. 下載 GitHub Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. 安裝 Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # 3. 清理舊的實價登錄 CSV
      # --------------------------------------------------

      - name: Clean raw data
        shell: bash
        run: |
          rm -f raw/*_lvr_land_*.csv
          rm -f raw/*_lvr_land_*.CSV
          rm -f raw/*lvr_land*.csv
          rm -f raw/*lvr_land*.CSV

          echo "目前 raw 資料："
          ls -lah raw || true


      # --------------------------------------------------
      # 4. 下載內政部最新 Open Data
      # --------------------------------------------------

      - name: Download MOI Open Data
        shell: bash
        run: |
          set -e

          URL="https://plvr.land.moi.gov.tw/Download?fileName=lvr_landcsv.zip&type=zip"

          echo "開始下載："
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "Mozilla/5.0" \
            -o /tmp/lvr_landcsv.zip \
            "$URL"

          echo "下載完成："
          ls -lh /tmp/lvr_landcsv.zip

          echo "檔案類型："
          file /tmp/lvr_landcsv.zip


      # --------------------------------------------------
      # 5. 解壓縮
      # --------------------------------------------------

      - name: Extract MOI data
        shell: bash
        run: |
          set -e

          rm -rf /tmp/lvr_data
          mkdir -p /tmp/lvr_data

          unzip -o /tmp/lvr_landcsv.zip \
            -d /tmp/lvr_data

          echo "解壓縮完成"
          echo "檔案列表："

          find /tmp/lvr_data \
            -type f \
            | head -100


      # --------------------------------------------------
      # 6. 複製 CSV 到 raw
      # --------------------------------------------------

      - name: Copy CSV files
        shell: bash
        run: |
          set -e

          find /tmp/lvr_data \
            -type f \
            \( -iname "*.csv" \) \
            -exec cp {} raw/ \;

          echo "raw CSV："

          find raw \
            -maxdepth 1 \
            -type f \
            -iname "*.csv" \
            -printf "%f\n" \
            | sort


      # --------------------------------------------------
      # 7. 確認 CSV 確實存在
      # --------------------------------------------------

      - name: Validate downloaded CSV
        shell: bash
        run: |
          COUNT=$(find raw \
            -maxdepth 1 \
            -type f \
            -iname "*.csv" \
            ! -name "income_ratio.csv" \
            | wc -l)

          echo "CSV 資料筆數：$COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "錯誤：沒有找到任何實價登錄 CSV"
            exit 1
          fi


      # --------------------------------------------------
      # 8. 執行 Python 建立 JSON
      # --------------------------------------------------

      - name: Build housing JSON
        run: |
          python build_data.py


      # --------------------------------------------------
      # 9. 檢查 JSON
      # --------------------------------------------------

      - name: Validate JSON
        shell: bash
        run: |
          set -e

          test -f data/taiwan_housing.json

          COUNT=$(python - <<'PY'
          import json

          with open(
              "data/taiwan_housing.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(len(data))
          PY
          )

          echo "JSON 資料筆數：$COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "錯誤：JSON 是空的"
            exit 1
          fi

          echo "JSON 驗證成功"


      # --------------------------------------------------
      # 10. 顯示前幾筆資料
      # --------------------------------------------------

      - name: Show generated data
        run: |
          python - <<'PY'
          import json

          with open(
              "data/taiwan_housing.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("前 5 筆：")

          for row in data[:5]:
              print(row)
          PY


      # --------------------------------------------------
      # 11. 提交更新
      # --------------------------------------------------

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/taiwan_housing.json

          if git diff --cached --quiet; then
            echo "沒有資料變化"
          else
            git commit -m "Update Taiwan housing data"
            git push
          fi
